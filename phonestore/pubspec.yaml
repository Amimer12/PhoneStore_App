name: shop_admin
description: Admin app for perfume + electronics shop management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  fl_chart: ^0.68.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  uuid: ^4.4.0
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
